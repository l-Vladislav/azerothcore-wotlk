<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Продвинутые профессии — админ-панель</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Раскладка страницы --------------------------------------------------
       Таблицы здесь длинные (материалов уже десятки), а редактирование идёт
       прямо в строках. Поэтому две вещи держатся на виду при прокрутке:
       переключатель вкладок и шапка таблицы. Отступы для них считает скрипт
       внизу страницы - высота топбара меняется, когда в него дорисовывают
       плашку профиля, и константа тут врала бы. */
    :root { --ap-top: 52px; --ap-tabs: 45px; }

    .ap-main { padding: 0 16px 48px; }

    .tabs {
      display: flex; gap: 6px; flex-wrap: wrap;
      position: sticky; top: var(--ap-top); z-index: 4;
      margin: 0 -16px 14px; padding: 9px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .tabs button {
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 4px;
      padding: 5px 12px; font: inherit; cursor: pointer;
      white-space: nowrap;
    }
    .tabs button:hover { border-color: var(--line-strong); color: var(--gold-bright); }
    .tabs button.active {
      background: var(--accent); color: #10151b; border-color: var(--accent);
      font-weight: 600;
    }
    /* «Применить на сервере» - не вкладка, а действие: отделяем зазором,
       чтобы его не жали по инерции, переключая разделы. */
    .tabs button.apply {
      margin-left: auto; border-color: var(--gold-dim); color: var(--gold-bright);
    }

    /* Пояснения ----------------------------------------------------------
       Текст-подсказка раньше сливался с содержимым; теперь это врезка с
       золотой полосой слева - её видно как справку, а не как данные. */
    .hint {
      color: var(--muted); font-size: 12px; line-height: 1.5;
      margin: 12px 0 14px; max-width: 940px;
      border-left: 2px solid var(--gold-dim);
      padding: 2px 0 2px 10px;
    }
    .hint b { color: var(--text); font-weight: 600; }

    /* Полоса добавления ---------------------------------------------------
       Общая форма «завести новую строку». Стоит НАД листом: карточка под
       таблицей на длинных вкладках оказывалась за экраном, и добавление
       выглядело недоступным. Прижата к шапке снизу - читается как часть
       панели управления, а не как первая строка данных. */
    .add-bar {
      display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;
      margin: 0 0 12px; padding: 8px 12px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 6px;
    }
    .add-bar .add-field {
      display: flex; flex-direction: column; gap: 3px;
      font-size: 12px; color: var(--muted);
    }
    .add-bar input, .add-bar select {
      background: var(--bg-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 3px;
      padding: 4px 6px; font: inherit; min-width: 150px;
    }
    .add-bar input:focus, .add-bar select:focus {
      outline: none; border-color: var(--gold-dim);
      box-shadow: 0 0 0 2px rgba(200, 170, 110, .16);
    }
    .add-bar input[type=number] { min-width: 92px; text-align: right; }

    /* Полоса отбора -------------------------------------------------------
       Отдельная от полосы добавления: та заводит строку, эта смотрит на уже
       заведённые. Держим её прозрачнее (без рамки-карточки), чтобы взгляд не
       путал два похожих ряда полей. */
    .filter-bar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      margin: 0 0 10px;
    }
    .filter-bar input, .filter-bar select {
      background: var(--bg-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 3px;
      padding: 4px 6px; font: inherit;
    }
    .filter-bar input.filter-q { min-width: 260px; }
    .filter-bar input:focus, .filter-bar select:focus {
      outline: none; border-color: var(--gold-dim);
      box-shadow: 0 0 0 2px rgba(200, 170, 110, .16);
    }
    .filter-tail {
      margin-left: auto; display: flex; align-items: center; gap: 10px;
    }
    .filter-count {
      color: var(--muted); font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* Листалка списка. Не путать с .pager ниже: та липнет ко дну окна выбора
       вида, эта стоит в потоке - в полосе отбора сверху и под таблицей снизу.
       Снизу она нужна не меньше: сотню строк дочитывают до конца, и идти за
       кнопкой «вперёд» обратно к началу - лишний ход. */
    .list-pager { display: inline-flex; align-items: center; gap: 6px; }
    .list-pager .pager-count { min-width: 58px; }
    .list-pager .btn { padding: 2px 9px; line-height: 1.2; }

    #view > .list-pager {
      display: flex; justify-content: center; margin: 12px 0 0;
    }

    /* Таблицы ------------------------------------------------------------- */
    /* separate, а не collapse: со схлопнутыми рамками Chrome теряет
       границы липкой шапки, и она повисает над данными без линии. */
    .grid { width: 100%; border-collapse: separate; border-spacing: 0;
            font-size: 13px;
            /* В общем style.css у .grid стоит overflow: hidden ради скруглённых
               углов - и именно он делает таблицу скролл-портом для липкой
               шапки: та перестаёт цепляться за окно и просто съезжает вниз на
               величину своего top. Углы тут дешевле шапки. */
            overflow: visible; }
    .grid th, .grid td {
      border-bottom: 1px solid var(--line);
      padding: 5px 8px; text-align: left; vertical-align: middle;
    }
    .grid th {
      color: var(--accent); font-weight: 600; white-space: nowrap;
      font-size: 11px; letter-spacing: .5px; text-transform: uppercase;
      background: var(--panel-2);
      border-bottom: 1px solid var(--line-strong);
      padding-top: 7px; padding-bottom: 7px;
    }
    .grid thead th {
      position: sticky; top: calc(var(--ap-top) + var(--ap-tabs)); z-index: 3;
    }
    /* Сортируемые заголовки: курсор и подсветка отличают их от колонок, по
       которым сортировать нечего (внешний вид, кнопки). Стрелка рисуется
       рядом с подписью, а не поверх, - иначе она прыгает по ширине колонки. */
    .grid th.sortable { cursor: pointer; user-select: none; }
    .grid th.sortable:hover { color: var(--gold-bright); }
    .grid th.sorted { color: var(--gold-bright); }
    .grid th .sort-arrow { margin-left: 4px; font-size: 9px; }
    /* Полосатость - чтобы взгляд не соскакивал на строку выше в широкой
       таблице основ, где между колонками много воздуха. */
    .grid tbody tr:nth-child(2n) td { background: rgba(255, 255, 255, .016); }
    .grid tr:hover td { background: var(--panel-2); }
    .grid tr.off td { opacity: .45; }

    .grid input[type=text], .grid input[type=number], .grid select {
      width: 100%; min-width: 60px; background: var(--bg-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 3px; padding: 3px 5px;
      font: inherit;
    }
    /* Текстовому полю незачем занимать всю свободную ширину: в «Балансе»
       имя корзины растягивалось на девятьсот пикселей. */
    .grid input[type=text] { max-width: 220px; }
    .grid select { max-width: 180px; }
    /* Ленивый список (см. lazySelect) показывает одну строку - выбранную, - и
       колонка сжимается по ней до нечитаемого «Медн...»: у обычного списка
       ширину держала самая длинная из четырёхсот строк, а у этого её нет.
       Больше не берём: таблица «Именных» и так занимает экран целиком, и
       лишние тридцать пикселей выталкивают за край столбец «Удалить». */
    .grid select.lazy { min-width: 110px; }
    .grid input[type=number] { text-align: right; max-width: 92px; }
    .grid input:focus, .grid select:focus {
      outline: none; border-color: var(--gold-dim);
      box-shadow: 0 0 0 2px rgba(200, 170, 110, .16);
    }
    .grid input[type=checkbox] { width: auto; min-width: 0; accent-color: var(--gold); }
    .grid td.act { white-space: nowrap; width: 1%; }
    .grid td.num { width: 84px; text-align: right; }
    .grid td.num input { margin-left: auto; }

    /* Ряд контролов внутри ячейки: пара «урон от - до», набор материалов
       синергии. Селекты здесь не должны тянуться на всю ячейку, иначе flex
       ставит их столбиком - именно так пять слотов синергии превращались в
       строку высотой в треть экрана. */
    .grid td .row { flex-wrap: nowrap; gap: 6px; }
    .grid td .row > select { width: auto; min-width: 116px; max-width: 140px; }
    .grid td .row > input[type=number] { width: 62px; min-width: 0; }

    .item-cell { display: flex; align-items: center; gap: 7px; min-width: 190px; }
    .item-cell img { width: 24px; height: 24px; border-radius: 3px;
                     background: var(--bg-2); flex: 0 0 auto; }
    .item-cell .nm b { display: block; }
    .item-cell .nm small { color: var(--muted); }

    .q0 { color: #9d9d9d; } .q1 { color: #ffffff; } .q2 { color: #1eff00; }
    .q3 { color: #0070dd; } .q4 { color: #a335ee; } .q5 { color: #ff8000; }

    .toolbar { display: flex; gap: 8px; align-items: center; margin: 14px 0 8px; }
    .toolbar h2 { font-size: 14px; margin: 0; color: var(--accent); }
    .warn { color: #e0705a; }

    /* Замечания к строке: почему основу нельзя включить. Идут ПОД своей
       строкой, а не в подсказке кнопки, - недописанная основа выглядит
       рабочей, и в игре это «кнопка молча не кует». */
    .grid tr.issues td {
      border-top: none; padding: 0 8px 8px; font-size: 11px;
    }
    .grid tr.issues .warn { opacity: .9; }

    /* Ячейка «предмет плюс кнопки»: иконка с именем, под ней выбор. */
    .grid td.item-pick .row { gap: 4px; margin-top: 4px; }
    .grid td.item-pick .btn { padding: 2px 6px; font-size: 11px; }

    /* Поля не своего типа: у щита нет урона, у меча нет брони. Гасим их
       заметнее, чем раньше, - выключенное поле не должно читаться как ноль,
       который кто-то забыл заполнить. */
    .grid td.dim input {
      opacity: .3; border-color: transparent; background: transparent;
      cursor: default;
    }

    .card { border: 1px solid var(--line); border-radius: 6px;
            background: var(--panel); padding: 14px 16px; margin-bottom: 14px; }
    .card > h2:first-child { margin-top: 0; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row label { font-size: 12px; color: var(--muted); }
    .row input, .row select {
      background: var(--bg-2); color: var(--text); border: 1px solid var(--line);
      border-radius: 3px; padding: 4px 6px; font: inherit;
    }
    .row input:focus, .row select:focus {
      outline: none; border-color: var(--gold-dim);
      box-shadow: 0 0 0 2px rgba(200, 170, 110, .16);
    }

    /* Выбор внешнего вида -------------------------------------------------
       Иконка, поле id и кнопка - одна логическая единица. Без запрета на
       перенос ячейка складывалась в три этажа и растягивала строку основы
       до сотни пикселей. */
    .look-td { width: 1%; white-space: nowrap; }
    .look-td .row { flex-wrap: nowrap; gap: 6px; }
    .look-td .row > input[type=number] { width: 76px; }
    /* Окно выбора, сетка иконок и ячейка предмета переехали в style.css:
       их просит и страница добычи. Здесь осталось своё. */
    .look-cell.on { border-color: var(--accent); background: var(--panel-2); }

    /* Гнездо набора: картинка камня и его имя одной кнопкой. Ряд таких гнёзд
       заменил ряд выпадающих списков - в игре игрок собирает тот же набор
       иконками, и панель показывает то же самое. */
    .gem-socket {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 4px;
      padding: 3px 8px 3px 4px; font: inherit; cursor: pointer;
      max-width: 190px;
    }
    .gem-socket:hover { border-color: var(--accent); }
    .gem-socket .nm {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* Пустое гнездо: пунктир читается как «сюда можно положить», сплошная
       рамка выглядела бы занятой ячейкой. */
    .gem-socket.empty { border-style: dashed; color: var(--muted); }
    .gem-socket.empty img { opacity: .35; }
    .look-id { font-size: 11px; color: var(--muted); }
    .look-n { font-size: 10px; color: var(--muted); opacity: .7; }

    /* Листалка выбора вида. Липнет к нижнему краю окна: со 120 иконками
       страница прокручивается, а кнопка «вперёд» нужна там же, где взгляд. */
    .pager {
      position: sticky; bottom: -14px; z-index: 2;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin: 10px -14px -14px; padding: 9px 14px;
      background: var(--panel); border-top: 1px solid var(--line);
    }
    .pager-count {
      color: var(--muted); font-size: 12px;
      min-width: 130px; text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* Сводка расхода в строке основы: набор коротких плашек «часть xN».
       Своё число основы подсвечено - типовое видно и на вкладке «Типы». */
    .cost-cell { line-height: 1.7; }
    .cost {
      display: inline-block; margin-right: 5px; padding: 1px 6px;
      border: 1px solid var(--line); border-radius: 10px;
      font-size: 11px; color: var(--muted); white-space: nowrap;
    }
    .cost.own { border-color: var(--gold-dim); color: var(--gold-bright); }
    .grid td.num .row small { font-size: 10px; white-space: nowrap; }

    /* Метка «схема есть, C++ ещё не читает». Ревизия §11 применена в базе
       раньше, чем в модуле: эти поля сохраняются, но на игру пока не влияют.
       Прятать их нельзя - владелец заводит числа заранее; молчать тоже
       нельзя - правка выглядела бы рабочей. */
    .wip {
      margin-left: 8px; padding: 1px 7px; border-radius: 9px;
      border: 1px solid var(--warn); color: var(--warn);
      font-family: var(--serif); font-size: 11px; font-weight: normal;
      vertical-align: middle; white-space: nowrap; cursor: help;
    }
    th .wip { margin-left: 4px; }

    .preview-out { margin-top: 10px; font-size: 13px; }
    .preview-out b { color: var(--accent); }
    .totals { margin-top: 6px; font-size: 14px; }
    .totals span { display: inline-block; margin-right: 12px; }

    /* --- вкладка «Связи» -------------------------------------------------
       Карта отвечает на вопрос «что из чего выходит», и её главный
       выразительный приём - отступ со скобкой: эскиз нарисован ВЕТКОЙ от своей
       основы, а не соседней строкой таблицы. Связь видно глазом, без сверки
       номеров. */
    .map-modes, .map-types { display: flex; gap: 6px; flex-wrap: wrap;
                             margin: 10px 0; }
    .map-types { margin-bottom: 14px; }
    .map-modes .chip, .map-types .chip { cursor: pointer; }
    .map-modes .chip.active, .map-types .chip.active {
      color: var(--gold-bright); border-color: var(--gold-dim);
      background: rgba(200, 162, 75, .12);
    }

    .map-box { display: flex; flex-direction: column; gap: 12px; }

    /* Диаграмма: полотно во всю ширину, панель управления над ним. Узлы
       рисует canvas, поэтому в разметке здесь всего три элемента - сколько бы
       тысяч связей ни было на картинке. */
    .graph-bar { display: flex; align-items: center; gap: 8px;
                 flex-wrap: wrap; margin: 10px 0 8px; }
    .graph-bar .chip { cursor: pointer; }
    .graph-bar .chip.active {
      color: var(--gold-bright); border-color: var(--gold-dim);
      background: rgba(200, 162, 75, .12);
    }
    .graph-bar .btn { padding: 2px 10px; }
    .graph-bar .muted { margin-left: 4px; }

    /* Ряды отбора: подпись и россыпь переключателей. Выбранные светятся так
       же, как виды, - это один и тот же приём на странице. */
    .graph-filters { display: flex; align-items: center; gap: 6px;
                     flex-wrap: wrap; margin: 0 0 8px; }
    .graph-filters .muted { margin-right: 2px; }
    .graph-filters .chip { cursor: pointer; }
    .graph-filters .chip.active {
      color: var(--gold-bright); border-color: var(--gold-dim);
      background: rgba(200, 162, 75, .12);
    }

    /* Строка поиска на диаграмме: та же высота и рамка, что у чипов рядом,
       иначе ряд отбора распадается на две линии по вертикали. */
    .graph-find {
      flex: 1 1 220px; max-width: 320px;
      padding: 2px 8px; font: inherit; font-size: 12px;
      color: var(--text); background: var(--panel-2);
      border: 1px solid var(--line); border-radius: 4px;
    }
    .graph-find:focus { outline: none; border-color: var(--gold-dim); }

    .graph-wrap { position: relative; border: 1px solid var(--line);
                  border-radius: 6px; background: var(--bg-2);
                  overflow: hidden; }
    .graph-canvas { display: block; width: 100%; cursor: grab; }
    .graph-canvas.dragging { cursor: grabbing; }

    /* Подсказка идёт за курсором, поэтому мышь сквозь неё должна проходить:
       иначе она сама себя и перекрыла бы. */
    .graph-tip {
      position: absolute; pointer-events: none; z-index: 2;
      max-width: 260px; padding: 4px 8px; font-size: 12px;
      color: var(--text); background: var(--panel-3);
      border: 1px solid var(--line-strong); border-radius: 4px;
    }

    .map-card {
      border: 1px solid var(--line); border-left: 3px solid var(--gold-dim);
      border-radius: 6px; background: var(--panel); padding: 12px 14px;
    }
    /* Выключенная строка гасится, но не прячется: выключенная основа - это
       состояние, а не отсутствие. */
    .map-card.off { opacity: .55; border-left-color: var(--line); }

    .map-head { display: flex; align-items: center; gap: 10px;
                flex-wrap: wrap; margin-bottom: 8px; }
    .map-head > b { font-family: var(--serif); font-size: 15px;
                    color: var(--gold-bright); }

    .map-set { display: flex; align-items: center; gap: 14px;
               flex-wrap: wrap; margin-bottom: 10px; font-size: 12px; }
    .map-piece { display: inline-flex; align-items: center; gap: 5px; }
    .map-mult { color: var(--gold-bright); font-size: 12px; }

    .map-gem { display: inline-flex; align-items: center; gap: 5px;
               font-size: 12px; }
    .map-gem img { width: 20px; height: 20px; border-radius: 3px;
                   background: var(--bg-2); }

    /* Ступени идут рядом, как лестница: качество слева направо. */
    .map-tiers { display: flex; gap: 10px; flex-wrap: wrap; }
    .map-tier {
      border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px;
      background: var(--bg-2); min-width: 210px;
    }
    .map-tier-head { font-size: 11px; text-transform: uppercase;
                     letter-spacing: .04em; color: var(--muted);
                     margin-bottom: 4px; }
    .map-tier .item-cell { min-width: 0; }

    /* Ветки эскизов: отступ и скобка слева - именно они и показывают, что эскиз
       принадлежит этой основе, а не лежит рядом. */
    .map-branches { margin: 10px 0 0 18px; display: flex;
                    flex-direction: column; gap: 8px; }
    .map-branch { position: relative; padding-left: 16px; }
    .map-branch::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 50%;
      width: 12px; border-left: 1px solid var(--line);
      border-bottom: 1px solid var(--line); border-bottom-left-radius: 6px;
    }
    .map-branch.off { opacity: .55; }
    .map-branch-head { display: flex; align-items: center; gap: 8px;
                       flex-wrap: wrap; }

    .map-line { display: flex; align-items: center; gap: 8px;
                flex-wrap: wrap; margin-top: 4px; }
    .map-plus { color: var(--muted); }
    .map-arrow { color: var(--gold-bright); font-size: 15px; }
    .map-note { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .map-note.warn { color: #e0705a; }

    .map-edit {
      background: none; border: none; padding: 0; font: inherit;
      font-size: 11px; color: var(--accent); cursor: pointer;
      text-decoration: underline dotted; margin-left: auto;
    }
    .map-edit:hover { color: var(--gold-bright); }

    /* Подсветка строки, к которой карта привела: полторы секунды, чтобы глаз
       успел зацепиться, и без мигания. */
    tr.flash > td { animation: flash-row 1.6s ease-out; }
    @keyframes flash-row {
      from { background: rgba(200, 162, 75, .35); }
      to   { background: transparent; }
    }
  </style>
</head>

  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">AC</span> Панель</a>
    <nav class="nav">
      <a href="/">Модули</a>

      <a href="/api/docs">API</a>
    </nav>
    <div class="spacer"></div>
  </header>

  <main class="ap-main">
    <div class="tabs" id="tabs"></div>
    <div id="view"><div class="empty">Загрузка…</div></div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/common.js"></script>
  <script src="/static/aprof.js"></script>
  <script>
    // Липкие заголовки считают отступ от живой высоты шапки, а не от
    // константы: common.js дорисовывает в неё плашку профиля уже после
    // загрузки, и на узком окне шапка переносится на вторую строку.
    (function () {
      const root = document.documentElement;
      function measure() {
        const bar = document.querySelector('.topbar');
        const tabs = document.querySelector('.tabs');
        if (bar) root.style.setProperty('--ap-top', bar.offsetHeight + 'px');
        if (tabs) root.style.setProperty('--ap-tabs', tabs.offsetHeight + 'px');
      }
      addEventListener('resize', measure);
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(measure);
        addEventListener('load', () => {
          measure();
          const bar = document.querySelector('.topbar');
          if (bar) ro.observe(bar);
        });
      } else {
        addEventListener('load', measure);
      }
    })();
  </script>
