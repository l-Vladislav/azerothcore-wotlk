<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Эффекты окружения — админ-панель</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">AC</span> Панель</a>
    <nav class="nav">
      <a href="/">Модули</a>
      <a href="/board.html">Доска</a>
      <a href="/spells.html">Мастерская</a>
      <a href="/dex.html">Каталог</a>
      <a href="/api/docs">API</a>
      <a class="active" href="/envfx.html">Окружение</a>
      <a href="/weather.html">Погода</a>
      <a href="/weather-settings.html">Настройки погоды</a>
    </nav>
    <div id="health" class="health">…</div>
    <div class="spacer"></div>
    <button id="btn-export" class="btn ghost" title="Выгрузить таблицу в pending_db_world/mod_env_effects_v2_seed.sql">Экспорт в SQL</button>
    <button id="btn-reload" class="btn ghost" title=".reload config на PTR">Перезагрузить правила</button>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <input id="zone-filter" class="input" type="search" placeholder="Фильтр зон…" autocomplete="off">
      <div id="zone-list" class="zone-list"></div>
      <div class="sidebar-foot">
        <input id="zone-add" class="input" type="search" placeholder="Добавить зону: имя или id" autocomplete="off">
        <div id="zone-add-results" class="add-results"></div>
      </div>
    </aside>

    <section id="editor" class="editor">
      <div class="empty">Выберите зону слева.</div>
    </section>
  </main>

  <div id="picker" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <strong id="picker-title">Выбор спелла</strong>
        <input id="picker-search" class="input" type="search" placeholder="Поиск по имени или id…" autocomplete="off">
        <button id="picker-close" class="btn ghost">Закрыть</button>
      </div>
      <div id="picker-list" class="picker-list"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/common.js"></script>
  <script src="/static/envfx.js"></script>
</body>
</html>
