<section class="forge-panel map-frame">
  <header>
    <h2>Карта погоды</h2>
    <!-- Действия страницы над картой: у карты своя строка, и заводить ради
         одной кнопки ещё одну шапку выше - значит тратить высоту впустую. -->
    <ng-content select="[map-header-actions]" />
    <nav aria-label="Континент карты">
      @for (key of mapKeys; track key) {
        <button
          type="button"
          class="forge-tab is-compact"
          [class.is-active]="active() === key"
          (click)="selectMap(key)"
        >
          {{ maps[key].title }}
        </button>
      }
    </nav>
  </header>
  @if (geometry(); as map) {
    <div class="canvas">
      <svg
        [attr.viewBox]="'0 0 ' + map.width + ' ' + map.height"
        role="img"
        [attr.aria-label]="maps[active()].title"
        [class.picking]="picking"
        (click)="pick($event)"
      >
        <image
          [attr.href]="maps[active()].art"
          x="0"
          y="0"
          [attr.width]="map.width"
          [attr.height]="map.height"
        />
        <g class="fronts" aria-label="Активные погодные фронты">
          @for (front of fronts(); track front.cyclone.id) {
            <g class="front">
              <title>
                Фронт №{{ front.cyclone.id }}: {{ front.cyclone.family_name }}, радиус
                {{ front.cyclone.radius }} ярдов
              </title>
              <g class="front-swirl" [attr.transform]="frontTransform(front)">
                <g
                  class="front-spin"
                  [class.spinning]="front.cyclone.spin_minutes > 0"
                  [style.transform-origin]="front.x + 'px ' + front.y + 'px'"
                  [style.animation-duration]="front.cyclone.spin_minutes * 60 + 's'"
                >
                  <image
                    class="front-texture"
                    href="/cyclone.png"
                    [attr.x]="front.x - front.radius * 0.8"
                    [attr.y]="front.y - front.radius * 0.8"
                    [attr.width]="front.radius * 1.6"
                    [attr.height]="front.radius * 1.6"
                  />
                </g>
              </g>
              <circle
                class="front-area"
                [attr.cx]="front.x"
                [attr.cy]="front.y"
                [attr.r]="front.radius"
                [attr.stroke]="front.color"
              />
              @if (front.eye > 0) {
                <circle
                  class="front-eye"
                  [attr.cx]="front.x"
                  [attr.cy]="front.y"
                  [attr.r]="front.eye"
                  [attr.stroke]="front.color"
                />
              }
              <path class="front-arrow" [attr.d]="frontArrow(front)" [attr.stroke]="front.color" />
              <!-- Номер рядом с видом: в списке слева фронты названы номерами,
                   и без него глазами их не сопоставить. -->
              <text class="front-label" [attr.x]="front.x" [attr.y]="frontLabelY(front)">
                №{{ front.cyclone.id }} · {{ front.cyclone.family_name }}
              </text>
            </g>
          }
        </g>
        @for (shape of map.zones; track shape.id) {
          <path
            [attr.d]="shape.path"
            [attr.fill]="fill(shape.id)"
            [attr.stroke]="stroke(shape.id)"
            [class.selected]="selectedId === shape.id"
            [class.inert]="!zone(shape.id)"
            (click)="zone(shape.id) && zoneSelected.emit(shape.id)"
          >
            <title>{{ label(shape.id) }}</title>
          </path>
        }
      </svg>
      <ng-content select="[map-stats]" />
      <ng-content select="[map-tools]" />
      <div class="legend">
        <span class="rain"></span> дождь <span class="snow"></span> снег
        <span class="storm"></span> буря
      </div>
    </div>
  } @else if (error()) {
    <p class="error">{{ error() }}</p>
  } @else {
    <p class="loading">Загружаем карту…</p>
  }
</section>
