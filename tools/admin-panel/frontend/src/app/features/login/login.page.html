<main class="gate">
  <section class="card">
    <div class="brand">
      <img src="/brand/azeroth-core-earth.png" alt="" width="56" height="56" /> Панель управления
    </div>
    <h1>Вход</h1>
    <p>Используйте профиль панели или выданный владельцем доступ.</p>
    @if (error()) {
      <div class="forge-alert is-error" role="alert">{{ error() }}</div>
    }
    <form (ngSubmit)="submit()">
      <label
        >Имя пользователя<input
          class="forge-field"
          [(ngModel)]="login"
          name="login"
          autocomplete="username"
          required
      /></label>
      <label
        >Пароль<input
          class="forge-field"
          [(ngModel)]="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
      /></label>
      <button type="submit" class="forge-btn is-wide" [disabled]="pending()">
        {{ pending() ? 'Входим…' : 'Войти' }}
      </button>
    </form>
    <details>
      <summary>Войти по токену владельца</summary>
      <form (ngSubmit)="submitToken()">
        <label
          >Токен<input
            class="forge-field"
            [(ngModel)]="token"
            name="token"
            type="password"
            autocomplete="off"
            required
        /></label>
        <button type="submit" class="forge-btn" [disabled]="pending()">Войти по токену</button>
      </form>
    </details>
  </section>
</main>
